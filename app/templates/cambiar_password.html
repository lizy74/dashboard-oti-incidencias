{% extends "base.html" %}

{% block title %}Cambiar Contraseña{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-base-content mb-2 flex items-center gap-3">
            <div class="p-3 bg-primary/10 rounded-lg">
                <i class="mdi mdi-lock-reset text-2xl text-primary"></i>
            </div>
            Cambiar Contraseña
        </h1>
        <p class="text-base-content/60">Actualiza tu contraseña de acceso de forma segura</p>
    </div>

    <!-- Form Card -->
    <div class="card bg-base-100 shadow-lg border border-base-300">
        <div class="card-body">
            <form method="POST" class="space-y-6">
                <!-- Contraseña Actual -->
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-semibold flex items-center gap-2">
                            <i class="mdi mdi-lock text-primary"></i> Contraseña Actual *
                        </span>
                    </label>
                    <input type="password" 
                           name="password_actual" 
                           id="password_actual"
                           placeholder="Ingresa tu contraseña actual" 
                           class="input input-bordered w-full focus:input-primary"
                           required>
                </div>

                <!-- Nueva Contraseña -->
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-semibold flex items-center gap-2">
                            <i class="mdi mdi-lock-open text-primary"></i> Nueva Contraseña *
                        </span>
                    </label>
                    <input type="password" 
                           name="password_nuevo" 
                           id="password_nuevo"
                           placeholder="Ingresa una nueva contraseña" 
                           class="input input-bordered w-full focus:input-primary"
                           required 
                           minlength="6">
                    <label class="label">
                        <span class="label-text-alt flex items-center gap-1 text-warning">
                            <i class="mdi mdi-information-outline"></i> Mínimo 6 caracteres
                        </span>
                    </label>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="form-control w-full">
                    <label class="label">
                        <span class="label-text font-semibold flex items-center gap-2">
                            <i class="mdi mdi-check-circle-outline text-primary"></i> Confirmar Nueva Contraseña *
                        </span>
                    </label>
                    <input type="password" 
                           name="password_confirmar" 
                           id="password_confirmar"
                           placeholder="Confirma tu nueva contraseña" 
                           class="input input-bordered w-full focus:input-primary"
                           required 
                           minlength="6">
                </div>

                <!-- Actions -->
                <div class="card-actions gap-3 pt-6 mt-8 justify-start">
                    <button type="submit" class="btn btn-primary gap-2">
                        <i class="mdi mdi-content-save"></i> Guardar Cambios
                    </button>
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline gap-2">
                        <i class="mdi mdi-close-circle-outline"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
